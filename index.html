<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>Equigrow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{
  color-scheme: dark;
  --ground:#0D0C0A; --surface:#171510; --raised:#211E17; --line:#34302460;
  --line-strong:#3E3829;
  --text:#F2ECDD; --muted:#A69D86; --faint:#6F6857;
  --gold:#D6B25E; --gold-hi:#F3E1A0; --gold-lo:#9C7A2E; --on-gold:#15120B;
  --mint:#7FD1A6; --mint-bg:#7FD1A61A;
  --amber:#EBA84A; --amber-bg:#EBA84A1C;
  --red:#E57A64; --red-bg:#E57A641C;
  --shadow:0 10px 30px #00000066;
  --display:"Marcellus","Optima","Candara",Georgia,serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    color-scheme: light;
    --ground:#F7F3EA; --surface:#FFFDF8; --raised:#F0E9DA; --line:#DDD3BD80; --line-strong:#D6CAAE;
    --text:#1B1811; --muted:#6A614C; --faint:#9A907A;
    --gold:#A8812B; --gold-hi:#C99A3A; --gold-lo:#7D5F1E; --on-gold:#FFFBF0;
    --mint:#2F8F5E; --mint-bg:#2F8F5E14; --amber:#B7751A; --amber-bg:#B7751A14; --red:#B8492F; --red-bg:#B8492F12;
    --shadow:0 8px 24px #5A4A2218;
  }
}
:root[data-theme="light"]{
  color-scheme: light;
  --ground:#F7F3EA; --surface:#FFFDF8; --raised:#F0E9DA; --line:#DDD3BD80; --line-strong:#D6CAAE;
  --text:#1B1811; --muted:#6A614C; --faint:#9A907A;
  --gold:#A8812B; --gold-hi:#C99A3A; --gold-lo:#7D5F1E; --on-gold:#FFFBF0;
  --mint:#2F8F5E; --mint-bg:#2F8F5E14; --amber:#B7751A; --amber-bg:#B7751A14; --red:#B8492F; --red-bg:#B8492F12;
  --shadow:0 8px 24px #5A4A2218;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--text);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:8px}
.app{max-width:520px;margin:0 auto;padding-inline:16px;padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ground);display:flex;align-items:center;gap:12px;padding-block:14px 12px;border-bottom:1px solid var(--line)}
.top .mark{width:40px;height:40px;flex:none}
.brand{display:flex;flex-direction:column;line-height:1.1}
.brand b{font-family:var(--display);font-weight:400;font-size:20px;letter-spacing:.14em;color:var(--gold-hi)}
.brand small{font-size:11px;color:var(--muted);letter-spacing:.04em}
.top .spacer{flex:1}
.iconbtn{position:relative;width:40px;height:40px;border-radius:12px;border:1px solid var(--line-strong);background:var(--surface);display:grid;place-items:center}
.iconbtn svg{width:19px;height:19px;stroke:var(--text)}
.dot{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 2px var(--surface)}

h1,h2,h3{margin:0;text-wrap:balance}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.greet{padding-block:20px 4px}
.greet h1{font-family:var(--display);font-weight:400;font-size:30px;line-height:1.15;margin-top:4px}
.greet h1 em{font-style:normal;color:var(--gold-hi)}
.sub{color:var(--muted);margin:6px 0 0}
section{margin-top:22px}
.sechead{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px}
.sechead h2{font-family:var(--display);font-weight:400;font-size:20px}
.link{background:none;border:0;color:var(--gold);font-weight:600;font-size:13px;padding:4px}

/* balance */
.balance{background:var(--surface);border:1px solid var(--line-strong);border-radius:20px;padding:18px;display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.ring{width:118px;height:118px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .c b{font-family:var(--display);font-weight:400;font-size:28px;display:block;line-height:1}
.ring .c span{font-size:11px;color:var(--muted);letter-spacing:.06em}
.legend{display:grid;gap:10px}
.lg{display:grid;grid-template-columns:10px 1fr auto;gap:8px;align-items:center;font-size:14px}
.lg i{width:10px;height:10px;border-radius:3px}
.lg b{font-variant-numeric:tabular-nums;font-weight:600}
.lg .of{color:var(--faint);font-weight:400}
.status{grid-column:1/-1;display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;font-size:13px}
.status.ok{background:var(--mint-bg);color:var(--mint)}
.status.warn{background:var(--amber-bg);color:var(--amber)}
.status svg{stroke:currentColor;flex:none;width:18px;height:18px;margin-top:1px}

/* week */
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{border:1px solid var(--line-strong);background:var(--surface);border-radius:14px;padding:8px 0;display:flex;flex-direction:column;align-items:center;gap:2px}
.day span{font-size:11px;color:var(--muted);letter-spacing:.05em}
.day b{font-size:17px;font-variant-numeric:tabular-nums}
.day .pips{display:flex;gap:3px;height:5px}
.day .pips i{width:5px;height:5px;border-radius:50%}
.day[aria-pressed="true"]{background:linear-gradient(160deg,var(--gold-hi),var(--gold) 55%,var(--gold-lo));border-color:transparent;color:var(--on-gold)}
.day[aria-pressed="true"] span{color:var(--on-gold);opacity:.8}
.day.today b{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:2px}
.agenda{margin-top:12px;display:grid;gap:8px}
.slot{display:grid;grid-template-columns:62px 1fr;gap:12px;align-items:stretch}
.slot time{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:12px;text-align:right}
.blk{border-radius:14px;padding:10px 14px;border:1px solid var(--line-strong);background:var(--surface)}
.blk h4{margin:0;font-size:14.5px;font-weight:600}
.blk p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
.blk.growth{border-color:transparent;background:linear-gradient(90deg,#D6B25E26,#D6B25E0A);box-shadow:inset 3px 0 0 var(--gold)}
.blk.me{border-color:transparent;background:var(--mint-bg);box-shadow:inset 3px 0 0 var(--mint)}
.blk.me h4{color:var(--mint)}
.blk.event{border-style:dashed;border-color:var(--gold)}
.blk.exam{border-color:transparent;background:var(--red-bg);box-shadow:inset 3px 0 0 var(--red)}

/* nudges */
.nudges{display:grid;gap:8px}
.nudge{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.nudge .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none;background:var(--raised)}
.nudge .ic svg{width:16px;height:16px}
.nudge p{margin:0;font-size:13.5px}
.nudge p b{color:var(--gold-hi);font-weight:600}

/* discover */
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line-strong);border-radius:14px;padding:0 12px}
.search svg{width:18px;height:18px;stroke:var(--muted);flex:none}
.search input{flex:1;border:0;background:transparent;padding:12px 0;outline:none;min-width:0}
.chips{display:flex;gap:8px;overflow-x:auto;padding-block:12px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:500;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--gold);color:var(--on-gold);border-color:var(--gold)}
.cards{display:grid;gap:14px;margin-top:10px}
.ev{background:var(--surface);border:1px solid var(--line-strong);border-radius:20px;padding:16px;display:grid;gap:12px}
.ev .row1{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.kind{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--gold)}
.ev h3{font-size:17px;font-weight:600;margin-top:3px;line-height:1.3}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--muted);margin-top:4px}
.meta span{display:inline-flex;align-items:center;gap:5px}
.meta svg{width:13px;height:13px;stroke:var(--muted)}
.match{flex:none;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;text-align:center;background:conic-gradient(var(--gold) calc(var(--p)*1%),var(--raised) 0)}
.match div{width:48px;height:48px;border-radius:50%;background:var(--surface);display:grid;place-items:center;line-height:1}
.match b{font-size:15px;font-variant-numeric:tabular-nums}
.match small{display:block;font-size:9px;color:var(--muted);letter-spacing:.08em;margin-top:2px}
.why{font-size:13px;color:var(--muted);margin:0}
.why b{color:var(--text);font-weight:600}
.badges{display:flex;flex-wrap:wrap;gap:6px}
.lvl{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px}
.lvl i{width:7px;height:7px;border-radius:50%;background:currentColor}
.lvl.light{color:var(--mint);background:var(--mint-bg)}
.lvl.medium{color:var(--amber);background:var(--amber-bg)}
.lvl.intense{color:var(--red);background:var(--red-bg)}
.tag{font-size:12px;padding:4px 10px;border-radius:999px;background:var(--raised);color:var(--text)}
.tag.new{box-shadow:inset 0 0 0 1px var(--gold);color:var(--gold-hi)}
.fit{display:flex;gap:8px;align-items:center;font-size:12.5px;font-weight:600}
.fit svg{width:16px;height:16px;flex:none;stroke:currentColor}
.fit.ok{color:var(--mint)} .fit.warn{color:var(--amber)} .fit.bad{color:var(--red)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border-radius:12px;padding:10px 16px;font-weight:600;font-size:14px;border:1px solid var(--line-strong);background:var(--raised)}
.btn.primary{background:linear-gradient(160deg,var(--gold-hi),var(--gold) 60%);border-color:transparent;color:var(--on-gold)}
.btn.done{background:var(--mint-bg);color:var(--mint);border-color:transparent}
.btn.ghost{background:transparent}
.empty{text-align:center;color:var(--muted);padding:40px 12px;border:1px dashed var(--line-strong);border-radius:18px}

/* skills */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px}
.stat b{font-family:var(--display);font-weight:400;font-size:26px;color:var(--gold-hi);display:block;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.areas{display:grid;gap:14px;background:var(--surface);border:1px solid var(--line-strong);border-radius:20px;padding:16px}
.area .t{display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px}
.area .t span{color:var(--muted);font-size:12.5px}
.bar{height:8px;border-radius:99px;background:var(--raised);overflow:hidden;position:relative}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--gold-lo),var(--gold),var(--gold-hi));transition:width .5s ease}
.bar b{position:absolute;top:0;bottom:0;width:2px;background:var(--ground)}
.ticks{display:flex;justify-content:space-between;font-size:10.5px;color:var(--faint);margin-top:4px;letter-spacing:.04em}
.taglist{display:flex;flex-wrap:wrap;gap:6px}
.path{display:grid;gap:0;position:relative;padding-left:22px}
.path::before{content:"";position:absolute;left:6px;top:8px;bottom:8px;width:2px;background:var(--line-strong)}
.step{position:relative;padding-block:6px 14px}
.step::before{content:"";position:absolute;left:-21px;top:12px;width:12px;height:12px;border-radius:50%;background:var(--ground);border:2px solid var(--gold)}
.step.doneS::before{background:var(--gold)}
.step h4{margin:0;font-size:14.5px;font-weight:600}
.step p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}

/* portfolio */
.pcard{background:var(--surface);border:1px solid var(--line-strong);border-radius:18px;padding:16px;display:grid;gap:8px}
.pcard .top2{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.pcard h3{font-size:16px;font-weight:600}
.pcard time{font-size:12px;color:var(--muted);white-space:nowrap}
.pcard p{margin:0;font-size:13.5px;color:var(--muted)}
.share{background:var(--raised);border-radius:16px;padding:14px;font-size:13.5px;white-space:pre-wrap;border:1px solid var(--line)}

/* profile */
.card{background:var(--surface);border:1px solid var(--line-strong);border-radius:20px;padding:16px;display:grid;gap:14px}
.field{display:grid;gap:6px}
.field label{font-size:13px;color:var(--muted);font-weight:500}
.field select,.field input[type=text]{background:var(--raised);border:1px solid var(--line-strong);border-radius:12px;padding:10px 12px;width:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
input[type=range]{width:100%;accent-color:var(--gold)}
.rangeval{display:flex;justify-content:space-between;align-items:baseline}
.rangeval b{font-variant-numeric:tabular-nums;color:var(--gold-hi)}
.wrap{display:flex;flex-wrap:wrap;gap:8px}
.wrap .chip{flex:initial}
.note{font-size:12px;color:var(--faint);text-align:center;margin-top:24px}

/* nav */
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:10;background:color-mix(in srgb,var(--ground) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line-strong);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px))}
nav.bottom .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.bottom button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:var(--faint);font-size:11px;font-weight:600;letter-spacing:.02em}
nav.bottom svg{width:22px;height:22px;stroke:currentColor}
nav.bottom button[aria-current="page"]{color:var(--gold-hi)}
nav.bottom button[aria-current="page"] svg{filter:drop-shadow(0 0 6px #D6B25E66)}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;background:var(--text);color:var(--ground);padding:10px 16px;border-radius:12px;font-size:13.5px;font-weight:600;transition:.25s;z-index:20;pointer-events:none;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.view{animation:in .3s ease}
@keyframes in{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:380px){.balance{grid-template-columns:1fr;justify-items:center}.legend{width:100%}}
/* onboarding + forms */
.onb{padding-block:28px 8px;display:grid;gap:20px}
.onb-hero{display:flex;gap:18px;align-items:center}
.onb-mark{width:92px;height:92px;flex:none;filter:drop-shadow(0 8px 24px #D6B25E40)}
.onb h1{font-family:var(--display);font-weight:400;font-size:30px;line-height:1.15;margin-top:4px}
.onb h1 em{font-style:normal;color:var(--gold-hi)}
.loading{display:grid;justify-items:center;gap:14px;text-align:center;padding-top:10vh}
.authcard{max-width:460px}
.gbtn{width:100%;background:var(--surface);border:1px solid var(--line-strong);padding:12px 16px}
.gbtn:hover{border-color:var(--gold)}
.or{display:flex;align-items:center;gap:12px;color:var(--faint);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line-strong)}
.hint{color:var(--faint);font-size:12px}
.field input[type=email],.field input[type=password]{background:var(--raised);border:1px solid var(--line-strong);border-radius:12px;padding:10px 12px;width:100%}
.syncst{display:block;margin-top:4px;color:var(--mint);font-weight:600}
.btn:disabled{opacity:.7;cursor:progress}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;background:var(--raised);border-radius:14px;margin-top:12px}
.seg button{border:0;background:transparent;border-radius:10px;padding:9px 8px;font-weight:600;font-size:13.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--gold-hi);box-shadow:0 1px 0 var(--line-strong)}
.drop{display:grid;justify-items:center;gap:6px;text-align:center;padding:26px 16px;border:1.5px dashed var(--line-strong);border-radius:16px;cursor:pointer;margin-top:12px}
.drop:hover{border-color:var(--gold)}
.drop svg{width:28px;height:28px;stroke:var(--gold)}
.drop .sub{font-size:13px;margin:0;max-width:44ch}
.drop.busy{cursor:progress}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid var(--raised);border-top-color:var(--gold);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.review{display:grid;gap:12px;margin-top:12px}
.rvhead{display:grid;gap:2px}.rvhead .sub{margin:0;font-size:13px}
.rvrows{display:grid;gap:8px;max-height:420px;overflow-y:auto;padding-right:2px}
.rvrow{display:grid;grid-template-columns:22px 70px 1fr 1fr;gap:6px;align-items:center}
.rvrow .rvsub{grid-column:2/-1}
.rvrow.off{opacity:.45}
.rvrow input[type=checkbox],.chk input{accent-color:var(--gold);width:18px;height:18px}
.rvrow select,.rvrow input[type=time],.rvrow input[type=text]{background:var(--raised);border:1px solid var(--line-strong);border-radius:10px;padding:7px 8px;width:100%;min-width:0;font-size:13.5px}
.chk{display:flex;gap:8px;align-items:center;font-size:13.5px;color:var(--muted)}
@media (min-width:1100px){.rvrow{grid-template-columns:22px 70px 118px 118px 1fr}.rvrow .rvsub{grid-column:auto}}
.formerr{margin:0;color:var(--red);font-size:13.5px;font-weight:600}
.btn.danger{background:var(--red);border-color:transparent;color:#fff}
.ttrow{display:grid;grid-template-columns:1fr auto 32px;gap:10px;align-items:center;font-size:13.5px;padding-block:2px}
.ttrow .tm{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.rm{width:32px;height:32px;border-radius:9px;border:0;background:transparent;display:grid;place-items:center}
.rm svg{width:16px;height:16px;stroke:var(--faint)}
.rm:hover svg{stroke:var(--red)}
.ttform{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding-top:12px;border-top:1px solid var(--line)}
.ttform #tsub{grid-column:1/3}
.ttform.ex{grid-template-columns:1fr 1fr}
.ttform.ex .btn{grid-column:1/-1}
.ttform input,.ttform select{background:var(--raised);border:1px solid var(--line-strong);border-radius:12px;padding:9px 10px;width:100%;min-width:0}
.cols{display:grid;gap:0 28px;grid-template-columns:minmax(0,1fr)}
.cols>div>section:first-child:not(.first){margin-top:22px}
.sidebrand{display:none}
.cols>div>.card:first-child{margin-top:22px}
@media (min-width:900px){
  body{padding-left:228px}
  body.noside{padding-left:0}
  .app{max-width:1160px;padding-inline:32px;padding-bottom:48px}
  .top .mark,.top .brand{display:none}
  nav.bottom{top:0;right:auto;width:228px;border-top:0;border-right:1px solid var(--line-strong);padding:28px 14px;background:var(--surface);backdrop-filter:none;-webkit-backdrop-filter:none;overflow-y:auto}
  nav.bottom .in{display:flex;flex-direction:column;gap:4px;max-width:none}
  .sidebrand{display:flex;flex-direction:column;align-items:center;gap:6px;padding-bottom:22px;margin-bottom:14px;border-bottom:1px solid var(--line)}
  nav.bottom .sidebrand svg{width:88px;height:88px;filter:drop-shadow(0 8px 20px #D6B25E30)}
  .sidebrand b{font-family:var(--display);font-weight:400;font-size:19px;letter-spacing:.16em;color:var(--gold-hi);margin-top:6px}
  .sidebrand small{font-size:11.5px;color:var(--muted)}
  nav.bottom button{flex-direction:row;gap:12px;padding:11px 14px;border-radius:12px;font-size:14.5px;justify-content:flex-start;color:var(--muted)}
  nav.bottom button:hover{background:var(--raised)}
  nav.bottom button[aria-current="page"]{background:var(--raised);color:var(--gold-hi)}

function learnedTags(){const s=new Set();S.past.forEach(p=>p.tags.forEach(t=>s.add(t)));S.done.forEach(id=>{const e=EVENTS.find(x=>x.id===id);e&&e.tags.forEach(t=>s.add(t))});return s}
function matchScore(e){
  const ints=S.profile.interests;const hit=e.areas.filter(a=>ints.includes(a));
  const learned=learnedTags();const nw=e.tags.filter(t=>!learned.has(t)).length;
  let s=38+(hit.length?34+Math.min(hit.length-1,1)*8:0)+Math.round(nw/e.tags.length*12);
  const y1=S.profile.year==="1st year";if(y1&&e.beginner)s+=8;if(y1&&!e.beginner)s-=6;if(!y1&&!e.beginner)s+=4;
  if(e.tags.some(t=>learned.has(t))&&nw>0)s+=4;
  return {score:Math.max(20,Math.min(98,s)),hit};
}
const weekOf=d=>iso(addDays(d,-((d.getDay()+6)%7)));
function plannedHours(wk){return S.planned.map(id=>EVENTS.find(e=>e.id===id)).filter(e=>e&&weekOf(parseD(e.date))===wk).reduce((a,e)=>a+Math.min(e.hours,12),0)}
function classHours(){let t=0;Object.values(S.tt).forEach(d=>d.forEach(c=>t+=Math.max(0,(mins(c[1])-mins(c[0]))/60)));return t}
function fit(e){
  const d=parseD(e.date);const ex=S.exams.find(x=>Math.abs(parseD(x.date)-d)<=86400000);
  if(ex)return{cls:"bad",icon:"x",txt:`Too close to ${ex.name} (${fmtD(parseD(ex.date))})`};
  const c=(S.tt[d.getDay()]||[]).find(c=>mins(e.start)<mins(c[1])&&mins(e.end.includes("+")?"23:59":e.end)>mins(c[0]));
  if(c)return{cls:"warn",icon:"alert",txt:`Clashes with ${c[2]} (${c[0]}–${c[1]})`};
  if(plannedHours(weekOf(d))+Math.min(e.hours,12)>S.profile.growth+6)return{cls:"warn",icon:"alert",txt:`Would push that week past your ${S.profile.growth}h growth limit`};
  return{cls:"ok",icon:"check",txt:"You're free · fits your balance"};
}

function agenda(i){
  const d=addDays(WEEK_START,i),wd=d.getDay(),items=[];
  (S.tt[wd]||[]).forEach(c=>items.push({t:c[0],cls:"",h:c[2],p:`${c[0]}–${c[1]} · Class`}));
  S.planned.map(id=>EVENTS.find(e=>e.id===id)).filter(e=>e&&e.date===iso(d)).forEach(e=>items.push({t:e.start,cls:"event",h:e.name,p:`${e.kind} · ${e.place}`}));
  S.exams.filter(x=>x.date===iso(d)).forEach(x=>items.push({t:"08:30",cls:"exam",h:x.name,p:"Exam"}));
  const weekend=wd===0||wd===6;
  items.push({t:weekend?"11:30":"17:00",cls:"growth",h:growthTask(i),p:`Growth · ${weekend?"1.5h":"1h"} · suggested`});
  items.push({t:weekend?"16:00":"18:30",cls:"me",h:weekend?"Free afternoon, no plans":"Me-time",p:weekend?"Protected · friends, rest, anything":"Protected · 2h"});
  items.sort((a,b)=>mins(a.t)-mins(b.t));
  return items.map(x=>`<div class="slot"><time>${x.t}</time><div class="blk ${x.cls}"><h4>${esc(x.h)}</h4><p>${esc(x.p)}</p></div></div>`).join("");
}

let TT_MODE="manual",TT_DRAFT=null,TT_BUSY=false,TT_ERR="",TT_FILE="",TT_REPLACE=false;

  if(!CLOUD)return seg+`<p class="sub" style="margin:0">Uploading a timetable works in the hosted version when you're signed in. For now, add classes manually.</p>`;

  if(TT_DRAFT){
    const on=TT_DRAFT.filter(r=>r.on).length;
    return seg+`<div class="review"><div class="rvhead"><b>Found ${TT_DRAFT.length} class${TT_DRAFT.length===1?"":"es"} in ${esc(TT_FILE)}</b><span class="sub">Check them and fix anything that's wrong before adding.</span></div>
    <div class="rvrows">${TT_DRAFT.map((r,i)=>`<div class="rvrow${r.on?"":" off"}"><input type="checkbox" data-rowchk="${i}" ${r.on?"checked":""} aria-label="Include this class">
      <select data-row="${i}" data-f="day" aria-label="Day">${[1,2,3,4,5,6,0].map(d=>`<option value="${d}" ${d===r.day?"selected":""}>${DAYNAMES[d].slice(0,3)}</option>`).join("")}</select>
      <input type="time" data-row="${i}" data-f="start" value="${r.start}" aria-label="Start time"><input type="time" data-row="${i}" data-f="end" value="${r.end}" aria-label="End time">
      <input type="text" class="rvsub" data-row="${i}" data-f="subject" value="${esc(r.subject)}" aria-label="Subject"></div>`).join("")}</div>
    ${Object.keys(S.tt).length?`<label class="chk"><input type="checkbox" id="ttReplace" ${TT_REPLACE?"checked":""}> Replace my current timetable instead of adding to it</label>`:""}
    <div class="actions"><button type="button" class="btn primary" id="ttAdd" ${on?"":"disabled"}>Add ${on} class${on===1?"":"es"}</button><button type="button" class="btn" id="ttDiscard">Discard</button></div></div>`;
  }
  return seg+`<label class="drop" for="ttFile"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>
    <b>Choose a photo or PDF of your timetable</b><span class="sub">JPG, PNG or PDF, up to 10 MB. A clear, straight photo works best. You'll review everything before it's added.</span>
    <input id="ttFile" type="file" accept="image/*,application/pdf" hidden></label>${TT_ERR?`<p class="formerr">${esc(TT_ERR)}</p>`:""}`;
}
const fileToB64=file=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(",")[1]);r.onerror=rej;r.readAsDataURL(file)});
const normTime=t=>{const m=String(t||"").trim().match(/^(\d{1,2})[:.](\d{2})\s*(am|pm)?$/i);if(!m)return null;let h=+m[1];const mi=+m[2],ap=(m[3]||"").toLowerCase();if(ap==="pm"&&h<12)h+=12;if(ap==="am"&&h===12)h=0;if(h>23||mi>59)return null;return `${String(h).padStart(2,"0")}:${String(mi).padStart(2,"0")}`};
async function readTimetableFile(file){
  TT_ERR="";
  if(!/^image\/|^application\/pdf$/.test(file.type)){TT_ERR="That file type isn't supported. Use a JPG, PNG or PDF.";render(true);return}
  if(file.size>10*1024*1024){TT_ERR="That file is over 10 MB. Try a smaller photo or a screenshot of the timetable.";render(true);return}
  TT_BUSY=true;TT_FILE=file.name;render(true);
  try{
    const AI=await import(fb.base+"firebase-ai.js");
    const ai=AI.getAI(fb.app,{backend:new AI.GoogleAIBackend()});
    const Sc=AI.Schema;
    const schema=Sc.object({properties:{classes:Sc.array({items:Sc.object({properties:{
      day:Sc.string({description:"Three-letter weekday: Mon, Tue, Wed, Thu, Fri, Sat or Sun"}),
      start:Sc.string({description:"Start time, 24-hour HH:MM"}),
      end:Sc.string({description:"End time, 24-hour HH:MM"}),
      subject:Sc.string({description:"Short subject name, e.g. 'Calculus' or 'Physics Lab'"})}})})}});
    const MODELS=["gemini-3.5-flash-lite","gemini-3.6-flash"]; // first = main reader, second = backup if the first is unavailable or out of free quota
    const mk=name=>AI.getGenerativeModel(ai,{model:name,generationConfig:{responseMimeType:"application/json",responseSchema:schema,temperature:0}});
    const prompt=`This is a student's weekly class timetable (a photo, screenshot or PDF). Extract every class session.
For each session give the weekday (Mon-Sun), start and end time in 24-hour HH:MM, and the subject.
- Timetables are often a grid: days down the side and periods/times across the top (or the reverse). Use the period header times for each cell.
- If cells contain course codes and there is a legend/key mapping codes to names, use the readable name (you may keep the code in brackets).
- Afternoon times written like 1:30 or 2.10 are PM: convert to 13:30 / 14:10.
- If the same subject fills consecutive periods (e.g. a lab), merge them into one session covering the whole span.
- Skip breaks, lunch, free/library periods and empty cells.
Return an empty list if this is not a timetable.`;
    const parts=[prompt,{inlineData:{mimeType:file.type,data:await fileToB64(file)}}];
    let res,lastErr;
    outer: for(const name of MODELS){
      const model=mk(name);
      for(let attempt=0;attempt<2;attempt++){
        try{res=await model.generateContent(parts);break outer}
        catch(err){lastErr=err;const m=String((err&&err.code||"")+" "+(err&&err.message||""));
          if(/api-not-enabled/.test(m))throw err;
          if(/quota|404|not found|no longer available/i.test(m))continue outer;          // try the backup model
          if(attempt===0&&/failed to fetch|overloaded|500|503|unavailable|network/i.test(m)){await new Promise(r=>setTimeout(r,3000));continue}
          continue outer}
      }
    }
    if(!res)throw lastErr;
    const data=JSON.parse(res.response.text());
    const rows=(data.classes||[]).map(c=>({day:DAYKEY[String(c.day||"").slice(0,3).toLowerCase()],start:normTime(c.start),end:normTime(c.end),subject:String(c.subject||"").trim(),on:true}))
      .filter(r=>r.day!==undefined&&r.start&&r.end&&r.subject&&mins(r.end)>mins(r.start))
      .sort((a,b)=>((a.day+6)%7)-((b.day+6)%7)||mins(a.start)-mins(b.start));
    if(!rows.length){TT_ERR="No classes were found in that file. Try a clearer photo, or add your classes manually.";TT_DRAFT=null}
    else TT_DRAFT=rows;
  }catch(e){
    console.warn(e);const m=String(e&&(e.code||e.message)||"");
    TT_ERR=/api-not-enabled|firebasevertexai/.test(m)?"Timetable reading isn't switched on yet. In the Firebase console, open AI Logic → Get started → choose the Gemini Developer API, then try again in a few minutes."
      :/quota/i.test(m)?"Today's free timetable-reading limit has been used up. Try again tomorrow, or add your classes manually."
      :/429|resource-exhausted|overloaded/i.test(m)?"The timetable reader is busy right now. Wait a minute and try again, or add classes manually."
      :"Couldn't read that file. Try a clearer photo or a PDF, or add your classes manually.";
    TT_DRAFT=null;
  }
  TT_BUSY=false;render(true);
}
function addDraftClasses(){
  const rows=TT_DRAFT.filter(r=>r.on&&r.subject.trim()&&normTime(r.start)&&normTime(r.end)&&mins(r.end)>mins(r.start));
  if(TT_REPLACE)S.tt={};
  let added=0;
  rows.forEach(r=>{const list=(S.tt[r.day]=S.tt[r.day]||[]);if(!list.some(c=>c[0]===r.start&&c[2].toLowerCase()===r.subject.trim().toLowerCase())){list.push([r.start,r.end,r.subject.trim()]);added++}});
  Object.keys(S.tt).forEach(d=>S.tt[d].sort((a,b)=>mins(a[0])-mins(b[0])));
  TT_DRAFT=null;TT_REPLACE=false;TT_MODE="manual";toast(`${added} class${added===1?"":"es"} added to your timetable`);render(true);
}

/* ---------- render ---------- */
const VIEWS={home:["Home",vHome],discover:["Discover",vDiscover],skills:["Skills",vSkills],portfolio:["Portfolio",vPortfolio],profile:["Profile",vProfile]};
function render(keep){
  const y=scrollY,gate=CLOUD&&AUTH_STATE!=="in",signed=!gate&&!!S.profile;
  document.body.classList.toggle("noside",!signed);
  $("nav.bottom").hidden=!signed;$("#topbar").hidden=!signed;
  $("#note").textContent=CLOUD?"Events shown are examples · Synced to your account":"Events shown are examples · Your data stays in this browser";
  $("#main").innerHTML=gate?vAuth():signed?`<div class="view"${keep?' style="animation:none"':""}>${VIEWS[S.view][1]()}</div>`:vOnboard();
  $("#nav").innerHTML=Object.entries(VIEWS).map(([k,[l]])=>`<button data-go="${k}" ${S.view===k?'aria-current="page"':""}>${svg(k)}<span>${l}</span></button>`).join("");
  scrollTo(0,keep?y:0);if(!gate)save();
}
document.addEventListener("click",ev=>{
  const b=ev.target.closest("button");if(!b)return;const d=b.dataset;
  if(d.oint){b.setAttribute("aria-pressed",b.getAttribute("aria-pressed")==="true"?"false":"true");return}
  if(d.demo){Object.assign(S,structuredClone(SAMPLE));S.view="home";toast("Sample profile loaded. Sign out any time from Profile.");render();return}
  if(d.ttmode){TT_MODE=d.ttmode;TT_ERR="";render(true);return}
  if(b.id==="ttAdd"){addDraftClasses();return}
  if(b.id==="ttDiscard"){TT_DRAFT=null;TT_ERR="";render(true);return}
  if(d.go){S.view=d.go;render();return}
  if(d.day){S.day=+d.day;render(true);return}
  if(d.filter){S.filter=d.filter;render(true);return}
  if(d.plan){S.planned.push(d.plan);toast("Added to your plan");render(true);return}
  if(d.unplan){S.planned=S.planned.filter(x=>x!==d.unplan);toast("Removed from your plan");render(true);return}
  if(d.save){S.saved=S.saved.includes(d.save)?S.saved.filter(x=>x!==d.save):[...S.saved,d.save];toast(S.saved.includes(d.save)?"Saved for later":"Removed from saved");render(true);return}
  if(d.done){S.planned=S.planned.filter(x=>x!==d.done);S.done.push(d.done);toast("Completed. Skills added to your profile");render(true);return}
  if(d.int){const i=S.profile.interests;if(i.includes(d.int)&&i.length===1){toast("Keep at least one interest");return}S.profile.interests=i.includes(d.int)?i.filter(x=>x!==d.int):[...i,d.int];render(true);return}
  if(d.deltt){const [day,i]=d.deltt.split("|").map(Number);S.tt[day].splice(i,1);if(!S.tt[day].length)delete S.tt[day];toast("Class removed");render(true);return}
  if(d.delex){S.exams.splice(+d.delex,1);toast("Exam removed");render(true);return}
  if(b.id==="bellBtn"){S.view="home";render();setTimeout(()=>$("#nudgeSec")?.scrollIntoView({behavior:"smooth",block:"center"}),50);return}
  if(b.id==="themeBtn"){const r=document.documentElement;const cur=r.dataset.theme||(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark");r.dataset.theme=cur==="dark"?"light":"dark";try{localStorage.setItem("equigrow.theme",r.dataset.theme)}catch(e){}return}
  if(b.id==="outBtn"){if(CLOUD&&USER){clearTimeout(syncT);pushCloud().finally(()=>{try{localStorage.removeItem(cacheKey())}catch(e){}fb.auth.signOut();toast("Signed out")});return}S.confirmOut=true;render(true);return}
  if(b.id==="gBtn"){fb.auth.google().catch(e=>showAuthErr(authMsg(e)));return}
  if(b.id==="swapAuth"){AUTH_MODE=AUTH_MODE==="signup"?"signin":"signup";AUTH_ERR="";render();return}
  if(b.id==="forgotBtn"){const em=$("#aemail").value.trim();if(!em){showAuthErr("Type your email above first, then tap Forgot password.");return}
    fb.auth.sendPasswordResetEmail(em).then(()=>{showAuthErr("");toast("Password reset link sent to "+em)}).catch(e=>showAuthErr(authMsg(e)));return}
  if(b.id==="outNo"){S.confirmOut=false;render(true);return}
  if(b.id==="outYes"){S=fresh();try{localStorage.removeItem(KEY)}catch(e){}render();toast("Signed out");return}
  if(b.id==="copyBtn"){const t=$("#shareTxt").textContent;const sel=()=>{const r=document.createRange();r.selectNodeContents($("#shareTxt"));const s=getSelection();s.removeAllRanges();s.addRange(r);toast("Text selected. Press Ctrl+C to copy")};
    try{navigator.clipboard.writeText(t).then(()=>toast("Copied to clipboard"),sel)}catch(e){sel()}return}
});
document.addEventListener("submit",ev=>{
  ev.preventDefault();const f=ev.target;
  if(f.id==="authForm"){
    const em=$("#aemail").value.trim(),pw=$("#apass").value,up=AUTH_MODE==="signup",btn=$("#authSubmit");
    if(!em||!pw){showAuthErr("Enter your email and password.");return}
    if(up&&pw.length<6){showAuthErr("Use at least 6 characters for your password.");return}
    btn.disabled=true;btn.textContent=up?"Creating account…":"Signing in…";
    (up?fb.auth.createUserWithEmailAndPassword(em,pw):fb.auth.signInWithEmailAndPassword(em,pw))
      .catch(e=>{showAuthErr(authMsg(e));btn.disabled=false;btn.textContent=up?"Create account":"Sign in"});
    return}
  if(f.id==="onbForm"){
    const name=$("#oname").value.trim(),ints=[...document.querySelectorAll("[data-oint][aria-pressed=true]")].map(x=>x.dataset.oint);
    const err=$("#oerr");
    if(!name||!ints.length){err.textContent=!name?"Enter your name to continue.":"Pick at least one interest so Equigrow can recommend events.";err.hidden=false;return}
    S.profile={name,college:$("#ocollege").value.trim(),branch:$("#obranch").value,year:$("#oyear").value,interests:ints,growth:+$("#ogrowth").value,me:+$("#ome").value};
    S.view="profile";toast(`Welcome, ${name}! Add your timetable next.`);render();return}
  if(f.id==="ttForm"){
    const day=+$("#tday").value,s=$("#tstart").value,e=$("#tend").value,sub=$("#tsub").value.trim();
    if(!sub||mins(e)<=mins(s)){toast("End time must be after start time");return}
    (S.tt[day]=S.tt[day]||[]).push([s,e,sub]);S.tt[day].sort((a,b)=>mins(a[0])-mins(b[0]));toast(`${sub} added on ${DAYNAMES[day]}`);render(true);$("#tday").value=day;return}
  if(f.id==="exForm"){
    const date=$("#exdate").value,name=$("#exname").value.trim();if(!date||!name)return;
    S.exams.push({date,name});S.exams.sort((a,b)=>a.date.localeCompare(b.date));toast("Exam added");render(true);return}
});
document.addEventListener("input",ev=>{
  const t=ev.target;
  if(t.dataset&&t.dataset.row!==undefined&&t.dataset.f&&t.dataset.f!=="day"){TT_DRAFT[+t.dataset.row][t.dataset.f]=t.value;return}
  if(t.id==="q"){S.q=t.value;const pos=t.selectionStart;render(true);const n=$("#q");n.focus();n.setSelectionRange(pos,pos);return}
  if(t.id==="ogrowth"){$("#ogv").textContent=t.value+"h";return}
  if(t.id==="ome"){$("#omv").textContent=t.value+"h";return}
  if(t.id==="pname"){S.profile.name=t.value;save();return}
  if(t.id==="pcollege"){S.profile.college=t.value;save();return}
  if(t.id==="pgrowth"){S.profile.growth=+t.value;$("#gv").textContent=t.value+"h";save();return}
  if(t.id==="pme"){S.profile.me=+t.value;$("#mv").textContent=t.value+"h";save();return}
});
document.addEventListener("change",ev=>{const t=ev.target;
  if(t.id==="ttFile"&&t.files&&t.files[0]){readTimetableFile(t.files[0]);return}
  if(t.dataset&&t.dataset.rowchk!==undefined){TT_DRAFT[+t.dataset.rowchk].on=t.checked;render(true);return}
  if(t.id==="ttReplace"){TT_REPLACE=t.checked;return}
  if(t.dataset&&t.dataset.row!==undefined&&t.dataset.f==="day"){TT_DRAFT[+t.dataset.row].day=+t.value;return}if(t.id==="pbranch"){S.profile.branch=t.value;save()}if(t.id==="pyear"){S.profile.year=t.value;save()}});
try{const th=localStorage.getItem("equigrow.theme");if(th)document.documentElement.dataset.theme=th}catch(e){}
function showAuthErr(m){AUTH_ERR=m;const el=$("#aerr");if(el){el.textContent=m;el.hidden=!m}}
render();
if(CLOUD)initCloud();
</script>
</body></html>
